<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Jogo 1 a 1000</title>
</head>
<body style="background:#111; color:white; font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">
    <div style="background:#222; padding:30px; border-radius:20px; text-align:center; width:280px; border:1px solid #444;">
        <h2>Adivinhação</h2>
        <input type="number" id="palpite" style="width:90%; padding:10px; margin:10px 0; border-radius:5px;">
        
        <button id="jogar" style="width:100%; padding:10px; background:#28a745; color:white; border:none; border-radius:5px; cursor:pointer;">PALPITAR</button>
        
        <button onclick="window.location.href='banco.html'" style="width:100%; padding:10px; background:gold; color:black; border:none; border-radius:5px; cursor:pointer; margin-top:10px;">VER BANCO 🏦</button>
        <button onclick="window.location.href='historico.html'" style="width:100%; padding:10px; background:#555; color:white; border:none; border-radius:5px; cursor:pointer; margin-top:10px;">HISTÓRICO 🧾</button>
        
        <div id="msg" style="margin-top:15px; font-weight:bold;"></div>
        <div style="margin-top:20px; color:gold;">Moedas: <span id="saldo-moedas">0</span></div>
    </div>

    <script src="script.js"></script>
    <script src="logica-moedas.js"></script>
</body>
</html>
