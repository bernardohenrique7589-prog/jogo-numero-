<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
</head>
<body style="background:#111; color:white; font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">

    <div style="background:#222; padding:30px; border-radius:20px; text-align:center; width:300px; border:1px solid #444;">
        <h2 id="titulo-jogo">Adivinhação</h2>
        <p id="info" style="color:#aaa; font-size: 14px; margin-bottom: 20px;">Carregando jogo...</p>
        
        <input type="number" id="palpite" placeholder="Seu palpite" 
               style="width:90%; padding:12px; margin-bottom:15px; border-radius:10px; border:none; text-align:center; font-size:18px;">
        
        <button id="jogar" style="width:100%; padding:12px; background:#28a745; color:white; border:none; border-radius:10px; cursor:pointer; font-weight:bold;">PALPITAR</button>
        
        <button onclick="window.location.href='banco.html'" style="width:100%; padding:10px; background:gold; color:black; border:none; border-radius:8px; cursor:pointer; font-weight:bold; margin-top:15px;">VER BANCO 🏦</button>
        
        <div id="msg" style="margin-top:20px; font-weight:bold; min-height:24px; color:yellow;"></div>
        
        <div style="margin-top:20px; color:gold;">
            Saldo: 💰 <span id="saldo-moedas">0</span>
        </div>
    </div>

    <script src="logica-moedas.js"></script>
    <script src="script.js"></script>
</body>
</html>
