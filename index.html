<body style="background:#111; color:white; font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">
    <div style="background:#222; padding:30px; border-radius:20px; text-align:center; width:280px; border:1px solid #444;">
        <h2>Adivinhação</h2>
        <p id="info" style="color:gray;">Número entre 1 e 100</p>
        <input type="number" id="palpite" style="width:100%; padding:10px; margin:10px 0; border-radius:5px; border:none; font-size:20px; text-align:center;">
        <button id="jogar" style="width:100%; padding:10px; background:#28a745; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">PALPITAR</button>
        <button id="config" style="width:100%; padding:5px; background:#555; color:white; border:none; border-radius:5px; cursor:pointer; margin-top:10px; font-size:12px;">⚙️ CONFIGURAR</button>
        <div id="msg" style="margin-top:15px; font-weight:bold; height:20px;"></div>
    </div>
    <script src="script.js"></script>

</body>
