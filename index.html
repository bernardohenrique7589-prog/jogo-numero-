<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
</head>
<body style="background:#111; color:white; font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">

    <div style="background:#222; padding:30px; border-radius:20px; text-align:center; width:300px; border:1px solid #444; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        
        <h2 id="titulo-jogo">Adivinhação 1 a 1000</h2>

        <div style="margin-bottom: 20px; display: flex; justify-content: center; gap: 10px;">
            <button onclick="mudarDificuldade(100)" style="background:#444; color:white; border:none; padding:8px 12px; border-radius:5px; cursor:pointer; font-size:12px;">100</button>
            <button onclick="mudarDificuldade(1000)" style="background:#444; color:white; border:none; padding:8px 12px; border-radius:5px; cursor:pointer; font-size:12px;">1000</button>
            <button onclick="mudarDificuldade(5000)" style="background:#444; color:white; border:none; padding:8px 12px; border-radius:5px; cursor:pointer; font-size:12px;">5000</button>
        </div>

        <p id="info" style="color:#aaa; font-size: 14px; margin-bottom: 20px;">Tente adivinhar o número!</p>
        
        <input type="number" id="palpite" placeholder="Seu palpite" 
               style="width:90%; padding:12px; margin-bottom:15px; border-radius:10px; border:none; text-align:center; font-size:18px; outline:none;">
        
        <button id="jogar" style="width:100%; padding:12px; background:#28a745; color:white; border:none; border-radius:10px; cursor:pointer; font-weight:bold; font-size:16px;">PALPITAR</button>
        
        <button onclick="window.location.href='banco.html'" style="width:100%; padding:10px; background:gold; color:black; border:none; border-radius:8px; cursor:pointer; font-weight:bold; margin-top:15px;">VER BANCO 🏦</button>
        
        <div id="msg" style="margin-top:20px; font-weight:bold; min-height:24px; color:yellow;"></div>
        
        <div style="margin-top:20px; border-top: 1px solid #333; padding-top:15px; color:gold;">
            Saldo: 💰 <span id="saldo-moedas">0</span>
        </div>
    </div>

    <script src="logica-moedas.js"></script>
    <script src="script.js"></script>
</body>
</html>
